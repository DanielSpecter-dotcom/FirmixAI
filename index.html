    body {

                    <h4 className="text-base font-bold text-white mt-2 group-hover:text-amber-400 transition-colors">Validez legal de la firma digital en contratos de alquiler</h4>
                    <p className="text-xs text-slate-400 mt-2 leading-relaxed">¿Es 100% legal un contrato firmado por WhatsApp o web en el Perú? Lo que dice la Ley 27269.</p>
                  </div>
                  <div className="mt-6 pt-4 border-t border-navy-800/60">
                    {/* ENLACE BLOG 4: Modifica el href a tu link real */}
                    <a href="https://example.com/blog/validez-legal-firma-digital" target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-amber-500 hover:text-amber-400 flex items-center space-x-1">
                      <span>Leer Artículo</span>
                      <span>→</span>
                    </a>
                  </div>
                </div>

                {/* BLOG 5: Impuestos SUNAT */}

                    <span className="text-[10px] font-extrabold text-amber-500 uppercase tracking-widest">Impuestos</span>
                    <h4 className="text-base font-bold text-white mt-2 group-hover:text-amber-400 transition-colors">Declaración de Impuesto al Alquiler ante SUNAT</h4>
                    <p className="text-xs text-slate-400 mt-2 leading-relaxed">Guía paso a paso sobre el pago del 5% del alquiler (Renta de 1era Categoría).</p>

                  <div className="mt-6 pt-4 border-t border-navy-800/60">
                    {/* ENLACE BLOG 5: Modifica el href a tu link real */}
                    <a href="https://example.com/blog/impuesto-alquiler-sunat" target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-amber-500 hover:text-amber-400 flex items-center space-x-1">
                      <span>Leer Artículo</span>
                      <span>→</span>
                    </a>
                  </div>
                </div>

              </div>

            </div>
          </section>
          {/* ========================================================================= */}
          {/* === FIN SECCIÓN DE BLOGS === */}
          {/* ========================================================================= */}

          {/* --- FOOTER --- */}
          <footer className="bg-navy-900 border-t border-navy-800 py-12 shrink-0">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6">

                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center text-navy-950">
                    ⚖️
                  </div>
                  <span className="font-display font-bold text-base text-white tracking-wide">FIRMIX IA</span>
                </div>

                <p className="text-[11px] text-slate-500 text-center md:text-right max-w-md leading-relaxed">
                  © 2026 Firmix IA. Todos los derechos reservados. Las firmas digitales emitidas cumplen estrictamente con la Ley N° 27269 de Firmas y Certificados Digitales de la República del Perú.
                </p>
              </div>
            </div>
          </footer>

            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-navy-900 border border-navy-800 rounded-3xl p-6 relative shadow-2xl">

                {/* Close Button */}
                <button
                  onClick={closeCheckout}
                  className="absolute top-4 right-4 text-slate-500 hover:text-white p-1 rounded-full hover:bg-navy-800 transition-colors focus:outline-none"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>

                {!checkoutMethod ? (
                  <div>
                    <h3 className="font-display font-bold text-xl text-white">Completar Suscripción</h3>
                    <p className="text-xs text-slate-400 mt-1">Estás adquiriendo el {pricingPlan === 'premium' ? 'Plan AI Premium (S/.29/mes)' : 'Plan Anual (S/.69/mes)'}.</p>

                    <h4 className="text-xs font-bold text-slate-400 mt-6 uppercase tracking-wider">Elige tu método de pago seguro:</h4>

                    <div className="space-y-3 mt-3">
                      {/* Yape/Plin button */}
                      <button
                        onClick={() => handleCheckout('yape')}
                        className="w-full p-4 bg-gradient-to-r from-purple-600/10 to-purple-800/10 border border-purple-500/30 hover:border-purple-500 rounded-2xl flex items-center justify-between text-left transition-all"

                            <h5 className="text-xs font-bold text-white">Yape / Plin</h5>
                            <p className="text-[10px] text-slate-400">Pago instantáneo con QR</p>
                          </div>
                        </div>
                        <span className="text-purple-400 text-xs font-extrabold uppercase">One-Tap</span>
                      </button>

                      {/* Credit Card button */}
                      <button
                        onClick={() => handleCheckout('card')}
                        className="w-full p-4 bg-navy-950 border border-navy-800 hover:border-amber-500/50 rounded-2xl flex items-center justify-between text-left transition-all"
                      >
                        <div className="flex items-center space-x-3">
                          <div className="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center text-sm font-bold text-white">💳</div>
                          <div>
                            <h5 className="text-xs font-bold text-white">Tarjeta de Crédito / Débito</h5>
                            <p className="text-[10px] text-slate-400">Visa, Mastercard, Amex</p>
                          </div>
                        </div>
                        <span className="text-slate-500 text-xs font-bold">Stripe</span>
                      </button>
                    </div>
                  </div>
                ) : checkoutSuccess ? (
                  <div className="text-center py-6">
                    <div className="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/20 mx-auto animate-bounce">
                      <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                    </div>

                    <h4 className="font-display font-bold text-xl text-white mt-6">¡Pago Confirmado!</h4>
                    <p className="text-xs text-slate-400 mt-2 px-4 leading-relaxed">
                      ¡Tu cuenta ha sido actualizada a Premium! Ya tienes acceso ilimitado a Scam Shield, la Firma Digital y la Bóveda Segura.
                    </p>

                    <button
                      onClick={closeCheckout}
                      className="mt-6 w-full py-3 bg-amber-500 hover:bg-amber-600 text-navy-950 font-bold text-xs rounded-xl shadow-md transition-all uppercase tracking-wider"
                    >
                      Empezar a usar Premium
                    </button>
                  </div>
                ) : (
                  <div>
                    {checkoutMethod === 'yape' ? (
                      <div className="text-center py-4">
                        <h4 className="font-bold text-white text-base">Escanea el Código QR para pagar</h4>
                        <p className="text-xs text-slate-400 mt-1">Abre Yape o Plin y escanea este código para transferir S/.{pricingPlan === 'premium' ? '29.00' : '69.00'}</p>

                        {/* QR Box mockup */}
                        <div className="my-6 w-44 h-44 bg-white p-3 rounded-2xl mx-auto shadow-inner flex flex-col justify-center items-center relative border border-slate-200">
                          {/* Mock QR lines */}
                          <div className="w-36 h-36 bg-[radial-gradient(#1e293b_30%,transparent_30%)] bg-[size:10px_10px] flex items-center justify-center">
                            <div className="w-12 h-12 bg-navy-950 rounded-lg flex items-center justify-center text-sm font-bold text-amber-500 border-2 border-white shadow">⚖️</div>
                          </div>
                          {/* Scanning light mockup */}
                          <div className="absolute top-2 left-2 right-2 h-0.5 bg-purple-500 animate-bounce"></div>
                        </div>

                        <div className="flex space-x-2">
                          <button
                            onClick={() => setCheckoutMethod(null)}
                            className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-xs rounded-xl border border-navy-700"
                          >
                            Atrás
                          </button>
                          <button
                            onClick={() => handleCheckout('yape')} // triggers success on second call
                            className="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md transition-all"
                          >
                            Simular Pago Exitoso
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <h4 className="font-bold text-white text-base">Ingresa los datos de tu tarjeta</h4>

                        <div className="space-y-3">
                          <div className="space-y-1">
                            <label className="text-[9px] font-bold text-slate-400 uppercase">Número de Tarjeta</label>
                            <div className="bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 text-xs text-white flex justify-between items-center">
                              <input type="text" placeholder="4242 4242 4242 4242" className="bg-transparent focus:outline-none flex-1 font-mono" />
                              <span className="text-[9px] font-extrabold text-slate-500">VISA</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div className="space-y-1">
                              <label className="text-[9px] font-bold text-slate-400 uppercase">Vencimiento</label>
                              <input type="text" placeholder="MM / AA" className="w-full bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none font-mono" />
                            </div>
                            <div className="space-y-1">
                              <label className="text-[9px] font-bold text-slate-400 uppercase">CVC</label>
                              <input type="password" placeholder="123" className="w-full bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none font-mono" />
                            </div>
                          </div>
                        </div>

                        <div className="pt-2 flex space-x-2">
                          <button
                            onClick={() => setCheckoutMethod(null)}
                            className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-xs rounded-xl border border-navy-700"
                          >
                            Atrás
                          </button>
                          <button
                            onClick={() => handleCheckout('card')}
                            className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-navy-950 font-bold text-xs rounded-xl shadow-md transition-all uppercase tracking-wider"
                          >
                            Pagar S/.{pricingPlan === 'premium' ? '29.00' : '69.00'}
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount to DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
