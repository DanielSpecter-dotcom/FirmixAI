    /* Sidebar scrollbar hidden */
    .sidebar-scroll::-webkit-scrollbar {
      display: none;
    }

    .sidebar-scroll {
      scrollbar-width: none;
    }

</head>

    // ─── AUTH HELPERS ─────────────────────────────────────────────────────────────

    const USERS_KEY = 'firmix_users';
    const SESSION_KEY = 'firmix_session';

    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
      catch { return []; }
    }

    function saveUser(user) {
      const users = getUsers();
      users.push(user);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function findUser(email, password) {
      return getUsers().find(u => u.email === email && u.password === password);
    }

    function emailExists(email) {
      return getUsers().some(u => u.email === email);
    }

    function setSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ name: user.name, lastName: user.lastName, email: user.email, plan: 'free' }));
    }

    // ─── SCAM USAGE HELPERS ────────────────────────────────────────────────────────
    const SCAM_USAGE_KEY = 'firmix_scam_usage';
    const FREE_SCAM_LIMIT = 3;

    function getScamUsage(email) {
      try {
        const all = JSON.parse(localStorage.getItem(SCAM_USAGE_KEY) || '{}');
        return all[email] || 0;
      } catch { return 0; }
    }

    function incrementScamUsage(email) {
      try {
        const all = JSON.parse(localStorage.getItem(SCAM_USAGE_KEY) || '{}');
        all[email] = (all[email] || 0) + 1;
        localStorage.setItem(SCAM_USAGE_KEY, JSON.stringify(all));
        return all[email];
      } catch { return 1; }
    }

    function getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch { return null; }
    }

    function clearSession() {
      localStorage.removeItem(SESSION_KEY);
    }

    // ─── ICONS ────────────────────────────────────────────────────────────────────

    // ─── AUTH SCREEN ──────────────────────────────────────────────────────────────

    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState('login'); // 'login' | 'register'
      const [form, setForm] = useState({ name: '', lastName: '', email: '', password: '', confirm: '' });
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [loading, setLoading] = useState(false);

      const set = (field, val) => setForm(f => ({ ...f, [field]: val }));

      const handleRegister = (e) => {
        e.preventDefault();
        setError(''); setSuccess('');
        if (!form.name.trim() || !form.lastName.trim()) return setError('Completa tu nombre y apellido.');
        if (!form.email.includes('@')) return setError('Ingresa un correo electrónico válido.');
        if (form.password.length < 6) return setError('La contraseña debe tener al menos 6 caracteres.');
        if (form.password !== form.confirm) return setError('Las contraseñas no coinciden.');
        if (emailExists(form.email)) return setError('Este correo ya está registrado. Inicia sesión.');
        setLoading(true);
        setTimeout(() => {
          saveUser({ name: form.name.trim(), lastName: form.lastName.trim(), email: form.email.toLowerCase(), password: form.password });
          setSuccess('¡Cuenta creada exitosamente! Ahora inicia sesión.');
          setLoading(false);
          setTimeout(() => { setMode('login'); setSuccess(''); setForm(f => ({ ...f, name: '', lastName: '', password: '', confirm: '' })); }, 1500);
        }, 1000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setError(''); setSuccess('');
        if (!form.email.trim() || !form.password.trim()) return setError('Completa todos los campos.');
        setLoading(true);
        setTimeout(() => {
          const user = findUser(form.email.toLowerCase(), form.password);
          if (!user) { setError('Correo o contraseña incorrectos.'); setLoading(false); return; }
          setSession(user);
          setLoading(false);
          onLogin(user);
        }, 1000);
      };

      return (
        <div className="min-h-screen bg-navy-950 flex items-center justify-center px-4 relative overflow-hidden">
          {/* Background ambient gradients */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-amber-500/5 rounded-full blur-[120px] pointer-events-none" />
          <div className="absolute bottom-0 right-0 w-[400px] h-[400px] bg-navy-600/10 rounded-full blur-[100px] pointer-events-none" />

          <div className="w-full max-w-md relative z-10">
            {/* Logo */}
            <div className="text-center mb-8 auth-card">
              <a href="index.html" className="inline-flex items-center space-x-3 group mb-6">
                <div className="w-12 h-12 bg-gradient-to-tr from-amber-500 to-amber-600 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:rotate-6 transition-transform p-2">
                  <img src="img/LogoFirmix2.png" className="w-full h-full object-contain" alt="Firmix Logo" />
                </div>
                <div className="text-left">
                  <span className="font-display font-bold text-2xl text-white tracking-wide">FIRMIX <span className="text-amber-500 font-extrabold text-sm align-super">IA</span></span>
                  <p className="text-[11px] text-slate-500 -mt-1 font-semibold uppercase tracking-wider">Abogado Digital</p>
                </div>
              </a>
              <h1 className="font-display font-bold text-2xl text-white mt-2">
                {mode === 'login' ? 'Bienvenido de vuelta' : 'Crea tu cuenta gratis'}
              </h1>
              <p className="text-slate-500 text-sm mt-1">
                {mode === 'login' ? 'Ingresa tus credenciales para continuar' : 'Empieza a proteger tus contratos hoy'}
              </p>
            </div>

            {/* Card */}
            <div className="bg-navy-900/80 border border-navy-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm auth-card">

              {/* Mode Switcher Tabs */}
              <div className="flex rounded-2xl bg-navy-950 p-1 mb-6 border border-navy-800">
                <button
                  onClick={() => { setMode('login'); setError(''); setSuccess(''); }}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${mode === 'login' ? 'bg-amber-500 text-navy-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  Iniciar Sesión
                </button>
                <button
                  onClick={() => { setMode('register'); setError(''); setSuccess(''); }}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${mode === 'register' ? 'bg-amber-500 text-navy-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  Crear Cuenta
                </button>
              </div>

              {/* Error / Success Messages */}
              {error && (
                <div className="mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-xs text-red-400 font-medium flex items-center space-x-2">
                  <span>⚠️</span><span>{error}</span>
                </div>
              )}
              {success && (
                <div className="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-emerald-400 font-medium flex items-center space-x-2">
                  <span>✅</span><span>{success}</span>
                </div>
              )}

              {/* REGISTER FORM */}
              {mode === 'register' && (
                <form onSubmit={handleRegister} className="space-y-4" id="form-register">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Nombre</label>
                      <input
                        id="reg-name"
                        type="text"
                        required
                        placeholder="Daniel"
                        value={form.name}
                        onChange={e => set('name', e.target.value)}

                                ) : (
                                  <div className="flex flex-col items-center text-center p-4">
                                    <svg className="w-12 h-12 text-slate-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5"><path strokeLinecap="round" strokeLinejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    <button type="button" onClick={startFaceScan}
                                      className="px-4 py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 text-xs font-bold rounded-xl uppercase tracking-wider transition-all">
                                      Iniciar Cámara
                                    </button>
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="flex space-x-3">
                              <button onClick={() => setSigStep(1)} className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-sm rounded-xl border border-navy-700 uppercase">Atrás</button>
                              <button onClick={() => faceScanDone && setSigStep(3)} disabled={!faceScanDone}
                                className={`flex-1 py-3 font-bold text-sm rounded-xl transition-all uppercase tracking-wider ${faceScanDone ? 'bg-amber-500 text-navy-950 hover:bg-amber-600' : 'bg-navy-800 text-slate-600 cursor-not-allowed border border-navy-800'}`}>
                                Siguiente →
                              </button>
                            </div>
                          </div>
                        )}

                        {/* STEP 3 */}
                        {sigStep === 3 && (
                          <div className="bg-navy-900 border border-navy-800 rounded-2xl p-6 animate-fade-in">
                            <h3 className="font-bold text-white text-base mb-1">Paso 3: Firma Manuscrita</h3>
                            <p className="text-slate-400 text-sm mb-5">Dibuja tu firma en el recuadro usando tu mouse o dedo.</p>
                            <div className="relative">
                              <div
                                ref={signatureCanvasRef}
                                className="w-full h-48 bg-navy-950 border border-navy-700 rounded-xl relative overflow-hidden select-none cursor-crosshair"
                                onMouseDown={() => setIsDrawing(true)}
                                onMouseUp={() => setIsDrawing(false)}
                                onMouseLeave={() => setIsDrawing(false)}
                                onMouseMove={handleDrawSignature}
                                onTouchStart={() => setIsDrawing(true)}
                                onTouchEnd={() => setIsDrawing(false)}
                                onTouchMove={handleDrawSignature}
                              >
                                {sigLines.length === 0 && (
                                  <div className="absolute inset-0 flex items-center justify-center text-slate-600 pointer-events-none text-sm uppercase font-bold tracking-wider">
                                    Firma aquí
                                  </div>
                                )}
                                <svg className="absolute inset-0 w-full h-full pointer-events-none">
                                  <polyline fill="none" stroke="#f59e0b" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"
                                    points={sigLines.map(p => `${p.x},${p.y}`).join(' ')} />
                                </svg>
                              </div>
                              <button type="button" onClick={() => setSigLines([])} className="mt-2 text-xs font-bold text-red-400 hover:text-red-300 uppercase tracking-wider float-right">
                                Borrar Firma
                              </button>
                            </div>
                            <div className="flex space-x-3 mt-8">
                              <button onClick={() => setSigStep(2)} className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-sm rounded-xl border border-navy-700 uppercase">Atrás</button>
                              <button onClick={handleSaveSignature} disabled={sigLines.length === 0}
                                className={`flex-1 py-3 font-bold text-sm rounded-xl transition-all uppercase tracking-wider ${sigLines.length > 0 ? 'bg-amber-500 text-navy-950 hover:bg-amber-600' : 'bg-navy-800 text-slate-600 cursor-not-allowed border border-navy-800'}`}>
                                Estampar Firma
                              </button>
                            </div>
                          </div>
                        )}

                        {/* STEP 4 */}
                        {sigStep === 4 && (
                          <div className="bg-navy-900 border border-navy-800 rounded-2xl p-8 text-center animate-fade-in">
                            <div className="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/20 animate-bounce mx-auto mb-6">
                              <svg className="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                            </div>
                            <h3 className="font-display font-bold text-2xl text-white">¡Contrato Firmado!</h3>
                            <p className="text-slate-400 text-sm mt-2 max-w-sm mx-auto leading-relaxed">
                              Se ha emitido la Firma Digital Calificada. El contrato está sellado criptográficamente y respaldado en tu Bóveda.
                            </p>
                            <div className="mt-6 p-4 bg-navy-950 border border-navy-800 rounded-xl text-left">
                              <span className="text-[10px] font-bold text-emerald-400 uppercase block mb-2">Certificado de Validez</span>
                              <div className="text-xs font-mono text-slate-400 space-y-1">
                                <div>HASH: f15a92a...f92931a</div>
                                <div>FECHA: {new Date().toLocaleString('es-PE')}</div>
                                <div>LEGALIDAD: Ley N° 27269 (Perú)</div>
                              </div>
                            </div>
                            <button onClick={resetSignatureFlow} className="mt-6 w-full py-3 bg-navy-800 hover:bg-navy-700 text-white font-bold text-sm rounded-xl border border-navy-700 transition-all uppercase">
                              Firmar Otro Documento
                            </button>
                          </div>
                        )}
                      </div>

                      {/* ── RIGHT PANEL — Firma Digital ── */}
                      <div className="lg:col-span-1 space-y-4">

                        {/* Progreso del flujo */}
                        <div className="bg-navy-900 border border-navy-800 rounded-2xl p-5">
                          <h3 className="font-bold text-white text-sm mb-4">Progreso de Firma</h3>
                          <div className="space-y-3">
                            {[
                              { n: 1, label: 'Identificación', desc: 'DNI de ambas partes' },
                              { n: 2, label: 'Validación Facial', desc: 'Biometría contra RENIEC' },
                              { n: 3, label: 'Firma Manuscrita', desc: 'Dibuja tu rúbrica' },
                              { n: 4, label: 'Certificado', desc: 'Sellado criptográfico' },
                            ].map((s) => (
                              <div key={s.n} className="flex items-center space-x-3">
                                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 transition-all ${sigStep > s.n ? 'bg-emerald-500 text-white' :
                                    sigStep === s.n ? 'bg-amber-500 text-navy-950 ring-4 ring-amber-500/20' :
                                      'bg-navy-800 text-slate-500'
                                  }`}>{sigStep > s.n ? '✓' : s.n}</div>
                                <div>
                                  <p className={`text-xs font-bold ${sigStep >= s.n ? 'text-white' : 'text-slate-500'}`}>{s.label}</p>
                                  <p className="text-[10px] text-slate-500">{s.desc}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Validez Legal */}
                        <div className="bg-gradient-to-br from-emerald-500/10 to-emerald-600/5 border border-emerald-500/20 rounded-2xl p-5">
                          <h3 className="font-bold text-emerald-400 text-sm mb-3">✅ Validez Legal</h3>
                          <div className="space-y-2">
                            {[
                              'Ley N° 27269 — Firmas Digitales',
                              'Vinculado a RENIEC vía biometría',
                              'Hash SHA-256 inmutable',
                              'Sellado de tiempo Indecopi',
                              'Aceptado en juzgados de Lima',
                            ].map((item, i) => (
                              <div key={i} className="flex items-center space-x-2">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0" />
                                <span className="text-[11px] text-slate-300">{item}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Seguridad */}
                        <div className="bg-navy-900 border border-navy-800 rounded-2xl p-5">
                          <h3 className="font-bold text-white text-sm mb-3">🔐 Seguridad</h3>
                          <div className="space-y-3">
                            {[
                              { icon: '🧠', label: 'IA Biométrica', desc: 'Comparación facial contra foto DNI' },
                              { icon: '⛓️', label: 'Blockchain', desc: 'Registro inmutable e irrepudiable' },
                              { icon: '📧', label: 'Notificación', desc: 'Copia a todos los firmantes' },
                            ].map((s, i) => (
                              <div key={i} className="flex items-start space-x-3">
                                <span className="text-lg shrink-0">{s.icon}</span>
                                <div>
                                  <p className="text-xs font-bold text-white">{s.label}</p>
                                  <p className="text-[10px] text-slate-500 mt-0.5">{s.desc}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Firmantes actuales */}
                        <div className="bg-navy-900 border border-navy-800 rounded-2xl p-5">
                          <h3 className="font-bold text-white text-sm mb-3">👥 Firmantes</h3>
                          <div className="space-y-2">
                            <div className="flex items-center justify-between p-2.5 bg-navy-950 rounded-xl">
                              <div>
                                <p className="text-[10px] font-bold text-amber-500 uppercase">Arrendador</p>
                                <p className="text-xs text-white font-semibold mt-0.5 truncate max-w-[140px]">{landlordName || '—'}</p>
                              </div>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${sigStep > 1 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-navy-800 text-slate-500'}`}>
                                {sigStep > 1 ? 'Verificado' : 'Pendiente'}
                              </span>
                            </div>
                            <div className="flex items-center justify-between p-2.5 bg-navy-950 rounded-xl">
                              <div>
                                <p className="text-[10px] font-bold text-amber-500 uppercase">Arrendatario</p>
                                <p className="text-xs text-white font-semibold mt-0.5 truncate max-w-[140px]">{tenantName || '—'}</p>
                              </div>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${sigStep > 3 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-navy-800 text-slate-500'}`}>
                                {sigStep > 3 ? 'Firmado' : 'Pendiente'}
                              </span>
                            </div>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                )
              )}

            </main>
          </div>

          {/* ── CHECKOUT MODAL ── */}
          {pricingPlan && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-navy-900 border border-navy-800 rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto relative auth-card">
                <button onClick={closeCheckout} className="absolute top-4 right-4 text-slate-500 hover:text-white p-1 rounded-full hover:bg-navy-800 transition-colors">
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>

                {!checkoutMethod ? (
                  <div>
                    <div className="flex items-center space-x-2.5 mb-4">
                      <div className="w-8 h-8 bg-gradient-to-tr from-amber-500 to-amber-600 rounded-lg flex items-center justify-center p-1 shrink-0">
                        <img src="img/LogoFirmix2.png" className="w-full h-full object-contain" alt="" />
                      </div>
                      <h3 className="font-display font-bold text-xl text-white">Completar Suscripción</h3>
                    </div>
                    <p className="text-xs text-slate-400 mb-6">Estás adquiriendo el {pricingPlan === 'premium' ? 'Plan AI Premium (S/.29/mes)' : 'Plan Anual (S/.69/mes)'}.</p>
                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Elige tu método de pago:</h4>
                    <div className="space-y-3">
                      <button onClick={() => handleCheckout('yape')}
                        className="w-full p-4 bg-gradient-to-r from-purple-600/10 to-purple-800/10 border border-purple-500/30 hover:border-purple-500 rounded-2xl flex items-center justify-between text-left transition-all">
                        <div className="flex items-center space-x-3">
                          <div className="w-10 h-10 bg-purple-500 rounded-lg flex items-center justify-center text-lg font-bold text-white">Y</div>
                          <div><h5 className="text-sm font-bold text-white">Yape / Plin</h5><p className="text-xs text-slate-400">Pago instantáneo con QR</p></div>
                        </div>
                        <span className="text-purple-400 text-xs font-extrabold uppercase">One-Tap</span>
                      </button>
                      <button onClick={() => handleCheckout('card')}
                        className="w-full p-4 bg-navy-950 border border-navy-800 hover:border-amber-500/50 rounded-2xl flex items-center justify-between text-left transition-all">
                        <div className="flex items-center space-x-3">
                          <div className="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center text-sm font-bold text-white">💳</div>
                          <div><h5 className="text-sm font-bold text-white">Tarjeta de Crédito / Débito</h5><p className="text-xs text-slate-400">Visa, Mastercard, Amex</p></div>
                        </div>
                        <span className="text-slate-500 text-xs font-bold">Stripe</span>
                      </button>
                    </div>
                  </div>
                ) : checkoutSuccess ? (
                  <div className="text-center py-6">
                    <div className="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/20 mx-auto animate-bounce">
                      <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <h4 className="font-display font-bold text-xl text-white mt-6">¡Pago Confirmado!</h4>
                    <p className="text-xs text-slate-400 mt-2 leading-relaxed px-4">
                      ¡Tu cuenta ha sido actualizada a Premium! Ya tienes acceso ilimitado a Scam Shield, la Firma Digital y la Bóveda Segura.
                    </p>
                    <button onClick={() => { setIsPremium(true); closeCheckout(); }}
                      className="mt-6 w-full py-3 bg-amber-500 hover:bg-amber-600 text-navy-950 font-bold text-sm rounded-xl shadow-md transition-all uppercase tracking-wider">
                      Empezar a usar Premium
                    </button>
                  </div>
                ) : (
                  <div>
                    {checkoutMethod === 'yape' ? (
                      <div className="text-center py-4">
                        <h4 className="font-bold text-white text-base">Escanea el Código QR</h4>
                        <p className="text-xs text-slate-400 mt-1">Transfiere S/.{pricingPlan === 'premium' ? '29.00' : '69.00'} con Yape o Plin</p>
                        <div className="my-6 w-44 h-44 bg-white p-3 rounded-2xl mx-auto flex flex-col justify-center items-center relative border border-slate-200 shadow-inner">
                          <div className="w-36 h-36 bg-[radial-gradient(#1e293b_30%,transparent_30%)] bg-[size:10px_10px] flex items-center justify-center">
                            <div className="w-12 h-12 bg-white rounded-lg flex items-center justify-center border-2 border-white shadow overflow-hidden">
                              <img src="img/LogoFirmix.png" className="w-full h-full object-contain" alt="Firmix Logo" />
                            </div>
                          </div>
                          <div className="absolute top-2 left-2 right-2 h-0.5 bg-purple-500 animate-bounce" />
                        </div>
                        <div className="flex space-x-3">
                          <button onClick={() => setCheckoutMethod(null)} className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-sm rounded-xl border border-navy-700">Atrás</button>
                          <button onClick={() => handleCheckout('yape')} className="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm rounded-xl transition-all">Simular Pago</button>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <h4 className="font-bold text-white text-base">Datos de tu tarjeta</h4>
                        <div>
                          <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">Número de Tarjeta</label>
                          <div className="bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 flex justify-between items-center">
                            <input type="text" placeholder="4242 4242 4242 4242" className="bg-transparent focus:outline-none flex-1 text-sm text-white font-mono" />
                            <span className="text-[10px] font-extrabold text-slate-500">VISA</span>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">Vencimiento</label>
                            <input type="text" placeholder="MM / AA" className="w-full bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none font-mono" />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">CVC</label>
                            <input type="password" placeholder="123" className="w-full bg-navy-950 border border-navy-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none font-mono" />
                          </div>
                        </div>
                        <div className="flex space-x-3 pt-2">
                          <button onClick={() => setCheckoutMethod(null)} className="flex-1 py-3 bg-navy-800 text-slate-300 font-bold text-sm rounded-xl border border-navy-700">Atrás</button>
                          <button onClick={() => handleCheckout('card')} className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-navy-950 font-bold text-sm rounded-xl transition-all uppercase">Pagar S/.{pricingPlan === 'premium' ? '29.00' : '69.00'}</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // ─── ROOT COMPONENT ───────────────────────────────────────────────────────────

    function App() {
      const [user, setUser] = useState(() => getSession());

      const handleLogin = (u) => setUser(u);
      const handleLogout = () => { clearSession(); setUser(null); };

      if (!user) return <AuthScreen onLogin={handleLogin} />;
      return <MainApp user={user} onLogout={handleLogout} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
